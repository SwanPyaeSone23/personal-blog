{% extends "base.html" %}
{% block title %}{% if article %}Edit{% else %}New{% endif %} Article{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">{% if article %}✏️ Edit Article{% else %}➕ New Article{% endif %}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" value="{{ article.title if article else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date (YYYY-MM-DD)</label>
                        <input type="date" name="date" class="form-control" value="{{ article.date if article else today }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Content</label>
                        <textarea name="content" class="form-control" rows="15" required>{{ article.content if article else '' }}</textarea>
                        <div class="form-text">You can write plain text. Line breaks are preserved.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">{% if article %}Update{% else %}Publish{% endif %}</button>
                        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
